<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for rendering markdown (bullet points, bold text) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #202123;
            --bg-main: #343541;
            --bg-input: #40414f;
            --text-main: #ececf1;
            --text-muted: #c5c5d2;
            --user-msg-bg: #444654;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: #2a2b32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar Styles --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--hover-bg);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s;
        }

        .history-item:hover {
            background-color: var(--hover-bg);
            color: var(--text-main);
        }

        /* --- Main Chat Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px; /* Space for input */
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-main);
            animation: fadeIn 0.5s ease;
        }

        .welcome-screen h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .welcome-screen p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Message Styles */
        .message-row {
            display: flex;
            width: 100%;
            padding: 20px;
            animation: slideUp 0.3s ease-out forwards;
        }

        .message-row.user {
            background-color: var(--user-msg-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .message-content {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            gap: 20px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar.ai { background-color: #10a37f; color: white; }
        .avatar.user { background-color: #5436DA; color: white; }

        .text {
            flex: 1;
            overflow-wrap: break-word;
        }

        /* Markdown Styling inside AI response */
        .text p { margin-bottom: 10px; }
        .text ul, .text ol { margin-left: 20px; margin-bottom: 10px; }
        .text strong { font-weight: 600; }
        .text pre { background: #000; padding: 10px; border-radius: 5px; overflow-x: auto; margin-top: 10px; }
        .text code { font-family: monospace; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }

        /* Typing Indicator */
        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            margin-right: 4px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        /* --- Input Area --- */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent, var(--bg-main) 40%);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 10px 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 200px;
            padding: 10px 0;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s;
            margin-bottom: 2px;
        }

        .send-btn:hover:not(:disabled) { color: var(--text-main); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-row { padding: 15px; }
        }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="chat-history">
            <div class="history-item"><i class="fas fa-message"></i> Business Communication Q&A</div>
            <div class="history-item"><i class="fas fa-message"></i> Principles of Oral Comm</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-container" id="chat-container">
            
            <!-- Welcome Screen (Hidden after first message) -->
            <div class="welcome-screen" id="welcome-screen">
                <h1>DocuMind AI</h1>
                <p>How can I help you with your document today?</p>
            </div>

            <!-- Messages will be injected here -->
            <div class="chat-messages" id="chat-messages"></div>
        </div>

        <!-- Input Area -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Message DocuMind AI..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        // Clear chat (New Chat button)
        function clearChat() {
            chatMessages.innerHTML = '';
            welcomeScreen.style.display = 'flex';
        }

        // Append Message to UI
        function appendMessage(text, role) {
            welcomeScreen.style.display = 'none'; // Hide welcome screen
            
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const avatar = role === 'ai' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';
            
            // Parse markdown for AI, plain text for user
            const parsedText = role === 'ai' ? marked.parse(text) : text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            row.innerHTML = `
                <div class="message-content">
                    <div class="avatar ${role}">${avatar}</div>
                    <div class="text">${parsedText}</div>
                </div>
            `;
            
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        // Typing Indicator
        function appendTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'typing-indicator';
            row.innerHTML = `
                <div class="message-content">
                    <div class="avatar ai"><i class="fas fa-robot"></i></div>
                    <div class="text typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        // Scroll to bottom
        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Send Message Logic
        async function sendMessage() {
            const question = inputField.value.trim();
            if (!question) return;

            // 1. Clear input and reset height
            inputField.value = '';
            inputField.style.height = 'auto';
            sendBtn.disabled = true;

            // 2. Add user message to UI
            appendMessage(question, 'user');

            // 3. Add typing indicator
            appendTypingIndicator();

            try {
                // 4. Call your Render Backend
                const response = await fetch('https://documind-api-live.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) throw new Error('Network response was not ok');

                const data = await response.json();
                
                // 5. Remove typing indicator and show AI response
                document.getElementById('typing-indicator').remove();
                appendMessage(data.answer, 'ai');

            } catch (error) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Error: Could not connect to the backend server. Please try again.", 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }
    </script>
</body>
</html>
