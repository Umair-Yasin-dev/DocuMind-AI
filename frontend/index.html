<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI - Document Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Default Dark Theme Variables */
            --bg-base: #0f172a;
            --bg-gradient-1: #1e1b4b;
            --bg-gradient-2: #0f172a;
            --chat-bg: rgba(30, 41, 59, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --user-msg-hover: #2563eb;
            --bot-msg: #334155;
            --input-bg: rgba(255, 255, 255, 0.05);
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        [data-theme="light"] {
            /* Light Theme Variables */
            --bg-base: #f1f5f9;
            --bg-gradient-1: #e2e8f0;
            --bg-gradient-2: #f8fafc;
            --chat-bg: rgba(255, 255, 255, 0.85);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --user-msg: #3b82f6;
            --user-msg-hover: #2563eb;
            --bot-msg: #ffffff;
            --input-bg: rgba(0, 0, 0, 0.03);
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at top right, var(--bg-gradient-1), transparent 50%),
                              radial-gradient(circle at bottom left, var(--bg-gradient-2), transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 650px;
            height: 88vh;
            background: var(--chat-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            box-shadow: 0 30px 60px -15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: floatIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            position: relative;
        }

        /* Subtle glowing effect behind the container */
        .chat-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 60%);
            z-index: -1;
            animation: rotateGlow 15s linear infinite;
            pointer-events: none;
        }

        .header {
            padding: 24px;
            background: rgba(0, 0, 0, 0.05);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .dot {
            width: 12px;
            height: 12px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 15px #10b981;
            animation: pulse 2s infinite;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--border-color);
            transform: translateY(-2px);
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            opacity: 0.3;
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: messageSlideIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .user-message {
            background: var(--user-msg);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
        }

        .bot-message {
            background: var(--bot-msg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .input-area {
            padding: 20px 24px;
            background: rgba(0, 0, 0, 0.05);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 16px;
            z-index: 10;
        }

        input[type="text"] {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--user-msg);
            background: var(--chat-bg);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        button#send-btn {
            background: var(--user-msg);
            color: white;
            border: none;
            padding: 0 28px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        button#send-btn:hover {
            background: var(--user-msg-hover);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
        }

        button#send-btn:active {
            transform: translateY(0) scale(0.98);
        }

        button#send-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.7;
        }

        /* Typing Indicator Animation */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 8px 4px;
            align-items: center;
            height: 24px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        /* Keyframe Animations */
        @keyframes floatIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes messageSlideIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <div class="header-left">
                <div class="dot"></div>
                <h1>Nexus AI Assistant</h1>
            </div>
            <!-- Theme Toggle Button -->
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
                ☀️ Light
            </button>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hello! I am connected to your document. What would you like to know?</div>
        </div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // --- Theme Logic ---
        const themeBtn = document.getElementById('theme-btn');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        
        // Set initial theme
        document.documentElement.setAttribute('data-theme', currentTheme);
        updateThemeBtn(currentTheme);

        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme');
            const newTheme = theme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeBtn(newTheme);
        }

        function updateThemeBtn(theme) {
            if (theme === 'dark') {
                themeBtn.innerHTML = '☀️ Light';
            } else {
                themeBtn.innerHTML = '🌙 Dark';
            }
        }

        // --- Chat Logic ---
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const sendBtn = document.getElementById('send-btn');
            const question = inputField.value.trim();

            if (!question) return;

            appendMessage(question, 'user-message');
            inputField.value = '';
            sendBtn.disabled = true;

            const loadingId = 'loading-' + Date.now();
            appendTypingIndicator(loadingId);

            try {
                // Yahan apna Live Render URL daala gaya hai
       const response = await fetch('https://documind-api-live.onrender.com/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: question })
});

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.answer, 'bot-message');

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Error: Could not connect to the backend server.', 'bot-message');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chat-box');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatBox.appendChild(messageDiv);
            
            // Smooth scroll to bottom
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function appendTypingIndicator(id) {
            const chatBox = document.getElementById('chat-box');
            const indicator = document.createElement('div');
            indicator.id = id;
            indicator.className = 'message bot-message typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(indicator);
            setTimeout(() => {
                chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            }, 50);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>s
</html>
