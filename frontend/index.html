<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI - Premium Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-base: #050505;
            --bg-panel: rgba(20, 20, 25, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --user-msg-bg: linear-gradient(135deg, #4f46e5, #7c3aed);
            --ai-msg-bg: rgba(30, 30, 40, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* --- Animated Background Orbs --- */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            opacity: 0.5;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: #4f46e5; top: -100px; right: -100px; }
        .orb-2 { width: 300px; height: 300px; background: #9333ea; bottom: -50px; left: -50px; animation-delay: -5s; }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .new-chat-btn {
            margin: 20px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .chat-history { flex: 1; padding: 10px; overflow-y: auto; }
        .history-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            margin-bottom: 5px;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--text-main); }

        /* --- Main Chat Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar { width: 6px; }
        .chat-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* --- Welcome Screen --- */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 1s ease;
        }

        .welcome-icon {
            font-size: 4rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            animation: pulseGlow 2s infinite alternate;
        }

        .welcome-screen h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .welcome-screen p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 30px; }

        /* Suggestion Chips */
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }
        .chip:hover { background: rgba(255, 255, 255, 0.1); color: white; border-color: var(--accent-color); transform: translateY(-2px); }

        /* --- Messages --- */
        .message-row {
            display: flex;
            width: 100%;
            gap: 16px;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .message-row.user { flex-direction: row-reverse; }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }
        .avatar.ai { background: linear-gradient(135deg, #4f46e5, #9333ea); box-shadow: 0 0 15px var(--accent-glow); }
        .avatar.user { background: #374151; color: #d1d5db; }

        .message-content {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .message-row.user .message-content {
            background: var(--user-msg-bg);
            border-top-right-radius: 4px;
        }

        .message-row.ai .message-content {
            background: var(--ai-msg-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
        }

        /* Markdown Styles */
        .message-content p { margin-bottom: 10px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 10px; }
        .message-content strong { color: #fff; font-weight: 600; }
        .message-content pre { background: #111; padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 10px; }

        /* --- Input Area --- */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent, var(--bg-base) 70%);
            padding: 20px 20px 30px 20px;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 12px 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow), 0 10px 30px rgba(0,0,0,0.5);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 150px;
            padding: 8px 0;
            line-height: 1.5;
        }
        textarea::placeholder { color: #6b7280; }

        .send-btn {
            background: var(--accent-color);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
            margin-left: 10px;
            margin-bottom: 2px;
        }
        .send-btn:hover:not(:disabled) { background: #4f46e5; transform: scale(1.05); }
        .send-btn:disabled { background: #374151; opacity: 0.5; cursor: not-allowed; }

        /* Typing Indicator */
        .typing-dots { display: flex; gap: 5px; align-items: center; height: 24px; }
        .typing-dots span {
            width: 6px; height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes pulseGlow { from { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.2)); } to { filter: drop-shadow(0 0 25px rgba(147, 51, 234, 0.6)); } }
        @keyframes floatOrb { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 30px) scale(1.1); } }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-content { max-width: 90%; }
            .welcome-screen h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Sidebar -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="chat-history">
            <div class="history-item"><i class="fas fa-message"></i> Business Comm Q&A</div>
            <div class="history-item"><i class="fas fa-message"></i> Principles of Oral Comm</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-container" id="chat-container">
            
            <div class="welcome-screen" id="welcome-screen">
                <i class="fas fa-sparkles welcome-icon"></i>
                <h1>DocuMind AI</h1>
                <p>Your intelligent document assistant.</p>
                <div class="suggestions">
                    <div class="chip" onclick="askSuggestion('What is the importance of communication?')">Importance of Communication</div>
                    <div class="chip" onclick="askSuggestion('What is the purpose of business communication?')">Purpose of Comm</div>
                    <div class="chip" onclick="askSuggestion('What are the 7 Cs of communication?')">7 C's of Comm</div>
                </div>
            </div>

            <div class="chat-messages" id="chat-messages"></div>
        </div>

        <!-- Input -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Message DocuMind AI..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            welcomeScreen.style.display = 'flex';
        }

        function askSuggestion(text) {
            inputField.value = text;
            sendMessage();
        }

        // Message append function
        function appendMessage(text, role) {
            welcomeScreen.style.display = 'none';
            
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const avatar = role === 'ai' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';
            const parsedText = role === 'ai' ? marked.parse(text) : text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            row.innerHTML = `
                <div class="avatar ${role}">${avatar}</div>
                <div class="message-content">${parsedText}</div>
            `;
            
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        // Typing indicator
        function appendTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'typing-indicator';
            row.innerHTML = `
                <div class="avatar ai"><i class="fas fa-robot"></i></div>
                <div class="message-content">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Main send function
        async function sendMessage() {
            const question = inputField.value.trim();
            if (!question) return;

            inputField.value = '';
            inputField.style.height = 'auto';
            sendBtn.disabled = true;

            appendMessage(question, 'user');
            appendTypingIndicator();

            try {
                // TUMHARA LIVE BACKEND URL
                const response = await fetch('https://documind-api-live.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                document.getElementById('typing-indicator').remove();
                
                // Simulate Typewriter effect for "Real AI" feeling
                simulateTypewriter(data.answer);

            } catch (error) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Error: Could not connect to the server.", 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        // Typewriter simulation (makes it feel like a real AI generating text)
        function simulateTypewriter(fullText) {
            const row = document.createElement('div');
            row.className = `message-row ai`;
            const avatar = '<i class="fas fa-robot"></i>';
            
            row.innerHTML = `
                <div class="avatar ai">${avatar}</div>
                <div class="message-content" id="typewriter-text"></div>
            `;
            chatMessages.appendChild(row);
            const textContainer = document.getElementById('typewriter-text');
            textContainer.innerHTML = '<span class="cursor">|</span>';
            scrollToBottom();

            let i = 0;
            const speed = 15; // Typing speed in ms

            function type() {
                if (i < fullText.length) {
                    // Using innerHTML to handle newlines properly during typing
                    const currentText = fullText.substring(0, i + 1);
                    textContainer.innerHTML = marked.parse(currentText) + '<span class="cursor">|</span>';
                    i++;
                    scrollToBottom();
                    setTimeout(type, speed);
                } else {
                    textContainer.innerHTML = marked.parse(fullText);
                    scrollToBottom();
                }
            }
            type();
        }
    </script>
    <style>
        /* Blinking cursor for typewriter */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #fff;
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</body>
</html>
