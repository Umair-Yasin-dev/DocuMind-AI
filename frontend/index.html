<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-sidebar: #000000;
            --bg-main: #212121;
            --bg-input: #2f2f2f;
            --text-main: #ececec;
            --text-muted: #b4b4b4;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: #2a2a2a;
            --accent: #10a37f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            margin: 15px;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .new-chat-btn:hover { background-color: var(--hover-bg); transform: scale(1.02); }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.2s, transform 0.1s;
        }
        .history-item:hover { background-color: var(--hover-bg); transform: translateX(4px); }

        /* --- Main Chat Area --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-color: var(--bg-main);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 150px;
            scroll-behavior: smooth;
        }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px;
            animation: fadeIn 1s ease;
        }

        .welcome-screen h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: white;
            animation: slideDown 0.8s ease;
        }

        /* --- Message Rows (ChatGPT Style) --- */
        .message-row {
            display: flex;
            width: 100%;
            padding: 24px 0;
            gap: 20px;
            border-bottom: 1px solid var(--border-color);
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .message-content {
            flex: 1;
            line-height: 1.7;
            font-size: 1rem;
            overflow-wrap: break-word;
            position: relative;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            transition: transform 0.2s;
        }

        .avatar.ai { background: var(--accent); color: white; }
        .avatar.user { background: #5436DA; color: white; }
        .message-row:hover .avatar { transform: scale(1.1); }

        /* Message Actions */
        .message-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message-row:hover .message-actions { opacity: 1; }

        .action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .action-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.1); transform: translateY(-2px); }

        /* Markdown Styling */
        .message-content p { margin-bottom: 1em; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 1em; }
        .message-content strong { color: #fff; font-weight: 600; }

        /* --- Input Area --- */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent, var(--bg-main) 40%);
            padding: 20px 20px 30px 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: flex-end;
            padding: 10px 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.2), 0 0 20px rgba(0,0,0,0.3);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 200px;
            padding: 8px 0;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            margin-left: 10px;
            margin-bottom: 2px;
        }

        .send-btn:hover:not(:disabled) { background: var(--hover-bg); color: white; transform: scale(1.1); }
        .send-btn.stop { background: white; color: black; }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Typing Cursor */
        .cursor {
            display: inline-block;
            width: 6px;
            height: 16px;
            background-color: var(--accent);
            animation: blink 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 4px;
        }
        
        /* Animations */
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-row { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-robot"></i> DocuMind AI
        </div>
        <button class="new-chat-btn" onclick="clearChat()">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="chat-history">
            <div class="history-item" onclick="loadSample('importance')">Importance of Comm</div>
            <div class="history-item" onclick="loadSample('purpose')">Purpose of Business Comm</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="chat-container" id="chat-container">
            
            <div class="welcome-screen" id="welcome-screen">
                <h1>How can I help you today?</h1>
            </div>

            <div class="chat-messages" id="chat-messages"></div>
        </div>

        <!-- Input -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Message DocuMind AI..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="handleSendClick()">
                    <i class="fas fa-paper-plane" id="send-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const sendIcon = document.getElementById('send-icon');
        const welcomeScreen = document.getElementById('welcome-screen');

        let isGenerating = false;
        let currentTypingInterval = null;

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (!isGenerating) sendMessage();
            }
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            welcomeScreen.style.display = 'flex';
            resetSendButton();
        }

        function loadSample(type) {
            clearChat();
            if(type === 'importance') inputField.value = "What is the importance of communication?";
            if(type === 'purpose') inputField.value = "What is the purpose of business communication?";
            sendMessage();
        }

        function resetSendButton() {
            isGenerating = false;
            sendBtn.disabled = false;
            sendBtn.classList.remove('stop');
            sendIcon.className = 'fas fa-paper-plane';
        }

        function setStopButton() {
            isGenerating = true;
            sendBtn.disabled = false;
            sendBtn.classList.add('stop');
            sendIcon.className = 'fas fa-square';
        }

        function handleSendClick() {
            if (isGenerating) {
                stopGeneration();
            } else {
                sendMessage();
            }
        }

        function stopGeneration() {
            if (currentTypingInterval) clearInterval(currentTypingInterval);
            resetSendButton();
        }

        function appendUserMessage(text) {
            welcomeScreen.style.display = 'none';
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `
                <div class="avatar user"><i class="fas fa-user"></i></div>
                <div class="message-content">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
            `;
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        function appendAIMessage(text, isTemp = false) {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            const id = 'msg-' + Date.now();
            row.id = id;
            
            row.innerHTML = `
                <div class="avatar ai"><i class="fas fa-robot"></i></div>
                <div class="message-content" id="${id}-content"></div>
            `;
            chatMessages.appendChild(row);
            
            if (!isTemp) {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'message-actions';
                actionsDiv.innerHTML = `
                    <button class="action-btn" onclick="copyText('${id}')"><i class="fas fa-copy"></i> Copy</button>
                `;
                row.querySelector('.message-content').appendChild(actionsDiv);
            }

            scrollToBottom();
            return id;
        }

        function copyText(id) {
            const text = document.getElementById(id + '-content').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.querySelector(`#${id} .action-btn`);
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                setTimeout(() => { btn.innerHTML = originalHTML; }, 2000);
            });
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const question = inputField.value.trim();
            if (!question || isGenerating) return;

            inputField.value = '';
            inputField.style.height = 'auto';
            
            appendUserMessage(question);
            setStopButton();

            const aiMessageId = appendAIMessage("", true);
            const textContainer = document.getElementById(aiMessageId + '-content');

            try {
                const response = await fetch('https://documind-api-live.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                document.getElementById(aiMessageId).remove();
                simulateTypewriter(data.answer);

            } catch (error) {
                document.getElementById(aiMessageId).remove();
                appendAIMessage("Error: Could not connect to the backend server.");
                resetSendButton();
            }
        }

        function simulateTypewriter(fullText) {
            const id = appendAIMessage("", true);
            const textContainer = document.getElementById(id + '-content');
            
            let i = 0;
            const speed = 12; 
            textContainer.innerHTML = '<span class="cursor"></span>';

            currentTypingInterval = setInterval(() => {
                if (i < fullText.length) {
                    const currentText = fullText.substring(0, i + 1);
                    textContainer.innerHTML = marked.parse(currentText) + '<span class="cursor"></span>';
                    i++;
                    scrollToBottom();
                } else {
                    clearInterval(currentTypingInterval);
                    textContainer.innerHTML = marked.parse(fullText);
                    
                    const row = document.getElementById(id);
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'message-actions';
                    actionsDiv.innerHTML = `
                        <button class="action-btn" onclick="copyText('${id}')"><i class="fas fa-copy"></i> Copy</button>
                        <button class="action-btn" onclick="regenerate()"><i class="fas fa-rotate-right"></i> Regenerate</button>
                    `;
                    row.querySelector('.message-content').appendChild(actionsDiv);
                    
                    resetSendButton();
                }
            }, speed);
        }

        function regenerate() {
            if (isGenerating) return;
            const messages = chatMessages.querySelectorAll('.message-row.user');
            if (messages.length > 0) {
                const lastQuestion = messages[messages.length - 1].querySelector('.message-content').innerText;
                const aiMessages = chatMessages.querySelectorAll('.message-row.ai');
                if (aiMessages.length > 0) aiMessages[aiMessages.length - 1].remove();
                
                inputField.value = lastQuestion;
                sendMessage();
            }
        }
    </script>
</body>
</html>
