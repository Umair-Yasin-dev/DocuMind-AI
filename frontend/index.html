<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuMind AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-main: #0B1120;
            --bg-sidebar: rgba(15, 23, 42, 0.7);
            --chat-bubble-user: linear-gradient(135deg, #3b82f6, #6366f1);
            --chat-bubble-ai: rgba(30, 41, 59, 0.8);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --glow-color: rgba(59, 130, 246, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(139, 92, 246, 0.15), transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .new-chat-btn {
            margin: 20px;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            margin-bottom: 5px;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            transform: translateX(5px);
        }

        /* --- Main Content --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 120px;
            display: flex;
            flex-direction: column;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-container::-webkit-scrollbar { width: 8px; }
        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        .chat-container::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        .chat-messages {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Welcome Screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        .welcome-icon {
            font-size: 3rem;
            color: #6366f1;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .welcome-screen h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome-screen p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* --- Messages --- */
        .message-row {
            display: flex;
            width: 100%;
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .message-row.user { justify-content: flex-end; }
        .message-row.ai { justify-content: flex-start; }

        .message-content {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: 20px;
            line-height: 1.6;
            font-size: 0.95rem;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .message-row.user .message-content {
            background: var(--chat-bubble-user);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.ai .message-content {
            background: var(--chat-bubble-ai);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        /* Markdown Styling */
        .message-content p { margin-bottom: 10px; }
        .message-content p:last-child { margin-bottom: 0; }
        .message-content ul, .message-content ol { margin-left: 20px; margin-bottom: 10px; }
        .message-content strong { font-weight: 700; color: #fff; }
        .message-content pre { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 10px; }

        /* Typing Indicator */
        .typing-dots { display: flex; gap: 5px; padding: 5px 0; }
        .typing-dots span {
            width: 8px; height: 8px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        /* --- Input Area --- */
        .input-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(180deg, transparent, var(--bg-main) 60%);
            padding: 20px 20px 30px 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            max-width: 800px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            align-items: flex-end;
            padding: 12px 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1), 0 10px 30px rgba(0,0,0,0.3);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 1rem;
            resize: none;
            outline: none;
            max-height: 150px;
            padding: 8px 0;
            line-height: 1.5;
        }

        textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            background: var(--chat-bubble-user);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-left: 10px;
            margin-bottom: 2px;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 15px var(--glow-color);
        }

        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #475569; }

        /* Keyframes */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUpFade { to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <button class="new-chat-btn" onclick="clearChat()">
            <i class="fas fa-plus"></i> New Chat
        </button>
        <div class="chat-history">
            <div class="history-item"><i class="fas fa-message"></i> Business Comm Q&A</div>
            <div class="history-item"><i class="fas fa-message"></i> 7 C's of Communication</div>
            <div class="history-item"><i class="fas fa-message"></i> Oral Comm Principles</div>
        </div>
    </div>

    <div class="main-content">
        <div class="chat-container" id="chat-container">
            
            <div class="welcome-screen" id="welcome-screen">
                <i class="fas fa-robot welcome-icon"></i>
                <h1>DocuMind AI</h1>
                <p>Your intelligent document assistant. Ask me anything!</p>
            </div>

            <div class="chat-messages" id="chat-messages"></div>
        </div>

        <div class="input-container">
            <div class="input-box">
                <textarea id="user-input" rows="1" placeholder="Message DocuMind AI..." oninput="autoResize(this)" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <i class="fas fa-arrow-up"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const chatMessages = document.getElementById('chat-messages');
        const inputField = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            welcomeScreen.style.display = 'flex';
        }

        function appendMessage(text, role) {
            welcomeScreen.style.display = 'none';
            
            const row = document.createElement('div');
            row.className = `message-row ${role}`;
            
            const parsedText = role === 'ai' ? marked.parse(text) : text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            row.innerHTML = `
                <div class="message-content">
                    ${parsedText}
                </div>
            `;
            
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        function appendTypingIndicator() {
            const row = document.createElement('div');
            row.className = 'message-row ai';
            row.id = 'typing-indicator';
            row.innerHTML = `
                <div class="message-content">
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `;
            chatMessages.appendChild(row);
            scrollToBottom();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const question = inputField.value.trim();
            if (!question) return;

            inputField.value = '';
            inputField.style.height = 'auto';
            sendBtn.disabled = true;

            appendMessage(question, 'user');
            appendTypingIndicator();

            try {
                // TUMHARA LIVE RENDER URL
                const response = await fetch('https://documind-api-live.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                document.getElementById('typing-indicator').remove();
                appendMessage(data.answer, 'ai');

            } catch (error) {
                document.getElementById('typing-indicator').remove();
                appendMessage("Error: Could not connect to the server. Please try again.", 'ai');
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                inputField.focus();
            }
        }
    </script>
</body>
</html>
