<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocuMind – Document Q&A Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#212121;--side:#000;--input:#2f2f2f;--ai:#10a37f;--user:#5436DA;--text:#ececec;--mute:#9b9b9b;--line:#3a3a3a;--hover:#2a2a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ai);outline-offset:2px}

/* Sidebar */
.sidebar{width:272px;background:var(--side);display:flex;flex-direction:column;padding:12px;flex-shrink:0;transition:transform .3s ease;z-index:30}
.new-chat{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;font-weight:500;font-size:14px;border:1px solid #262626;transition:background .2s,transform .2s}
.new-chat:hover{background:#1c1c1c;transform:translateY(-1px)}
.new-chat:active{transform:scale(.98)}
.new-chat i{color:var(--ai)}
.hist-label{font-size:12px;color:var(--mute);font-weight:500;padding:20px 12px 8px}
.hist{list-style:none;overflow-y:auto;flex:1}
.hist li{padding:10px 12px;border-radius:10px;font-size:14px;color:#d0d0d0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s}
.hist li:hover{background:#171717}
.hist li.active{background:#212121;color:#fff}
.hist li{display:flex;align-items:center;gap:6px}
.hist li span{flex:1;overflow:hidden;text-overflow:ellipsis}
.hist li .del{opacity:0;width:26px;height:26px;border-radius:6px;color:var(--mute);font-size:12px;transition:opacity .2s,background .2s,color .2s}
.hist li:hover .del,.hist li .del:focus-visible{opacity:1}
.hist li .del:hover{background:#2c2c2c;color:#ff8b8b}
.hist-empty{padding:10px 12px;font-size:13px;color:var(--mute);line-height:1.5}
.clear{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:10px;font-size:14px;color:#d0d0d0;transition:background .2s,color .2s,transform .2s}
.clear:hover{background:#1c1c1c;color:#ff8b8b;transform:translateY(-1px)}
.sidebar{position:relative}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:64px;height:64px;font-size:26px;background:var(--user)}
.pmenu{position:absolute;left:10px;right:10px;bottom:70px;background:#2f2f2f;border:1px solid #444;border-radius:16px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.55);opacity:0;transform:translateY(8px) scale(.97);transform-origin:bottom left;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40}
.pmenu.open{opacity:1;transform:none;pointer-events:auto}
.pmail{padding:10px 12px;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left;transition:background .15s}
.pi:hover{background:#3d3d3d}
.pi i{width:18px;text-align:center;color:#cfcfcf}
.pi .chev{margin-left:auto;font-size:11px;transition:transform .2s}
.pi.openc .chev{transform:rotate(90deg)}
.psep{height:1px;background:#444;margin:6px 4px}
.psub{display:none;padding-left:18px}.psub.open{display:block}
.psub .pi{font-size:13.5px;padding:8px 12px}
.profile{width:100%;border-radius:10px;text-align:left;transition:background .2s}
.profile:hover{background:#1c1c1c}
.profile>span:not(.av){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:60;padding:16px;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.dlg{background:#2a2a2a;border:1px solid #444;border-radius:20px;width:min(440px,100%);max-height:90vh;overflow:auto;animation:rise .3s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px;font-size:17px}
.x{width:32px;height:32px;border-radius:8px;transition:background .2s}.x:hover{background:#3a3a3a}
.db{padding:8px 20px 20px;font-size:14.5px;line-height:1.6;color:#d6d6d6}
.prow{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:#3a3a3a;font-size:14px;cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:#464646;transform:translateY(-1px)}
.btn.ghost{background:none;color:var(--mute)}
.btn.pri{background:var(--ai);color:#fff;width:100%;justify-content:center;margin-top:6px}
.btn.pri:hover{background:#0e8f6f}
.fl{display:block;margin-bottom:12px;font-size:13px;color:var(--mute)}
.fl input,.fl select{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:10px;border:1px solid #444;background:#212121;color:var(--text);font:inherit;font-size:14.5px;outline:0;transition:border-color .2s,box-shadow .2s}
.fl input:focus,.fl select:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(16,163,127,.18)}
.lopt{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #444;margin-bottom:8px;transition:background .2s,border-color .2s}
.lopt:hover{background:#333}.lopt.on{border-color:var(--ai)}.lopt i{color:var(--ai)}
.tips{margin-left:20px}.tips li{margin:6px 0}
.profile{display:flex;align-items:center;gap:10px;padding:12px;border-top:1px solid #1a1a1a;font-size:14px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;color:#fff;flex-shrink:0}
.av.u{background:var(--user)}
.av.a{background:linear-gradient(135deg,var(--ai),#0b7d62);box-shadow:0 0 0 1px rgba(255,255,255,.08)}

/* Main */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:600;font-size:16px;position:relative;z-index:5}
header .menu{display:none;width:36px;height:36px;border-radius:8px}
header .menu:hover{background:var(--hover)}
header small{color:var(--mute);font-weight:400;font-size:13px}
#chat{flex:1;overflow-y:auto;scroll-behavior:smooth;padding-bottom:170px}
.wrap{max-width:768px;margin:0 auto;padding:0 20px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:14vh;gap:14px}
.empty .av{width:56px;height:56px;font-size:24px}
.empty h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.empty p{color:var(--mute);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px}
.chip{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:#cfcfcf;transition:background .2s,transform .2s,border-color .2s}
.chip:hover{background:var(--hover);border-color:#555;transform:translateY(-2px)}

.msg{display:flex;gap:16px;padding:18px 0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.msg .body{flex:1;min-width:0;font-size:15.5px;line-height:1.7;overflow-wrap:anywhere}
.msg .who{font-weight:600;font-size:14px;margin-bottom:4px}
.msg.user{flex-direction:row-reverse}
.msg.user .content{flex:none;max-width:78%}
.msg.user .who{display:none}
.msg.user .body{background:#2f2f2f;padding:11px 18px;border-radius:22px 22px 6px 22px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.msg.ai .content{flex:1;min-width:0}
.body p{margin:0 0 12px}.body p:last-child{margin-bottom:0}
.body ul,.body ol{margin:0 0 12px 22px}.body li{margin:4px 0}.body li::marker{color:var(--mute)}
.body strong{color:#fff;font-weight:600}
.body code{background:#2f2f2f;padding:2px 6px;border-radius:6px;font-size:13.5px}
.body pre{background:#151515;border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:0 0 12px}
.body pre code{background:none;padding:0}
.body a{color:#7ab7ff}
.body.err{color:#ff8b8b}
.cur{display:inline-block;width:8px;height:17px;background:var(--text);margin-left:2px;vertical-align:text-bottom;border-radius:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:5px;padding:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bounce 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.wait-note{font-size:12.5px;color:var(--mute);margin-top:2px}

.actions{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .2s}
.msg:hover .actions,.actions:focus-within{opacity:1}
.actions.hide{display:none}
.act{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:12.5px;color:var(--mute);transition:background .2s,color .2s,transform .2s}
.act:hover{background:var(--hover);color:#fff;transform:scale(1.05)}
.act:active{transform:scale(.95)}

/* Composer */
.composer{position:absolute;left:0;right:0;bottom:0;padding:0 20px 14px;background:linear-gradient(to top,var(--bg) 62%,rgba(33,33,33,0));padding-top:48px;pointer-events:none}
.composer>*{pointer-events:auto}
.box{max-width:768px;margin:0 auto;background:var(--input);border:1px solid transparent;border-radius:26px;display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 20px;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:border-color .25s,box-shadow .25s}
.box:focus-within{border-color:rgba(16,163,127,.7);box-shadow:0 0 0 3px rgba(16,163,127,.15),0 0 24px rgba(16,163,127,.22),0 8px 30px rgba(0,0,0,.25)}
textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:15.5px;line-height:1.5;max-height:200px;padding:6px 0}
textarea::placeholder{color:#8e8e8e}
#send{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex-shrink:0;transition:transform .2s,background .2s,opacity .2s}
#send:hover:not(:disabled){transform:scale(1.1);background:#e6e6e6}
#send:active:not(:disabled){transform:scale(.92)}
#send:disabled{opacity:.25;cursor:not-allowed}
#send.stop i{font-size:12px}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:10px}

.scrim{display:none}
@media (max-width:820px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
  header .menu{display:grid;place-items:center}
  .msg{gap:12px}.empty h1{font-size:22px}
}
@media (hover:none){.actions{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <button class="new-chat" id="newChat"><i class="fa-solid fa-pen-to-square"></i> <span data-i18n="newChat">New chat</span></button>
  <div class="hist-label" data-i18n="hist">Chat history</div>
  <ul class="hist" id="hist"></ul>
  <button class="clear" id="clear"><i class="fa-solid fa-trash-can"></i> <span data-i18n="clear">Clear history</span></button>
  <div class="pmenu" id="pmenu" role="menu">
    <div class="pmail" id="pMail">Local profile</div>
    <button class="pi" data-act="settings"><i class="fa-solid fa-gear"></i><span data-i18n="settings">Settings</span></button>
    <button class="pi" data-act="language"><i class="fa-solid fa-globe"></i><span data-i18n="language">Language</span></button>
    <button class="pi" data-act="help"><i class="fa-regular fa-circle-question"></i><span data-i18n="help">Get help</span></button>
    <div class="psep"></div>
    <button class="pi" data-act="learn"><i class="fa-solid fa-circle-info"></i><span data-i18n="learn">Learn more</span><i class="fa-solid fa-chevron-right chev"></i></button>
    <div class="psub" id="psub">
      <button class="pi" data-act="about">About DocuMind</button>
      <button class="pi" data-act="shortcuts">Keyboard shortcuts</button>
      <button class="pi" data-act="privacy">Privacy</button>
    </div>
    <div class="psep"></div>
    <button class="pi" data-act="logout"><i class="fa-solid fa-arrow-right-from-bracket"></i><span data-i18n="logout">Log out</span></button>
  </div>
  <button class="profile" id="pBtn" aria-haspopup="menu" aria-expanded="false"><span class="av u"></span><span id="pName">My workspace</span><i class="fa-solid fa-ellipsis"></i></button>
</aside>
<div class="scrim" id="scrim"></div>

<main>
  <header>
    <button class="menu" id="menu" aria-label="Open sidebar"><i class="fa-solid fa-bars"></i></button>
    DocuMind <small data-i18n="sub">Document Q&amp;A</small>
  </header>

  <div id="chat">
    <div class="wrap" id="thread">
      <div class="empty" id="empty">
        <div class="av a"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
        <h1 data-i18n="title">What would you like to know?</h1>
        <p data-i18n="lead">Ask a question about your documents and get an answer in seconds.</p>
        <div class="chips">
          <button class="chip">Summarize the main points</button>
          <button class="chip">What are the key deadlines?</button>
          <button class="chip">List the action items</button>
        </div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Ask anything about your documents" data-i18n-ph="ph" dir="auto"></textarea>
      <button id="send" disabled aria-label="Send message"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
    <div class="foot" data-i18n="foot">DocuMind can make mistakes. Check important information.</div>
  </div>
</main>

<script>
const API_URL = 'https://documind-api-live.onrender.com/ask';
const $ = s => document.querySelector(s);
const chat = $('#chat'), thread = $('#thread'), input = $('#input'), sendBtn = $('#send');
let busy = false, ctrl = null, timer = null, stopFn = null;
const EMPTY = thread.innerHTML, KEY = 'documind_chats_v1';
let chats = [], cur = null;
try { chats = JSON.parse(localStorage.getItem(KEY)) || []; } catch { chats = []; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch {} };

/* ---------- helpers ---------- */
const render = t => DOMPurify.sanitize(marked.parse(t, { breaks: true }));
const nearBottom = () => chat.scrollHeight - chat.scrollTop - chat.clientHeight < 140;
const toBottom = () => chat.scrollTo({ top: chat.scrollHeight });
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function setBusy(b) {
  busy = b;
  sendBtn.classList.toggle('stop', b);
  sendBtn.innerHTML = b ? '<i class="fa-solid fa-square"></i>' : '<i class="fa-solid fa-arrow-up"></i>';
  sendBtn.setAttribute('aria-label', b ? 'Stop generating' : 'Send message');
  sendBtn.disabled = !b && !input.value.trim();
}

function resize() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  if (!busy) sendBtn.disabled = !input.value.trim();
}

function addMsg(role, html, instant) {
  $('#empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (instant) el.style.animation = 'none';
  const ai = role === 'ai';
  el.innerHTML = `<div class="av ${ai ? 'a' : 'u'}">${ai ? '<i class="fa-solid fa-wand-magic-sparkles"></i>' : avInner()}</div>
    <div class="content"><div class="who">${ai ? 'DocuMind' : 'You'}</div><div class="body" dir="auto">${html}</div>
    ${ai ? `<div class="actions hide"><button class="act copy"><i class="fa-regular fa-copy"></i> Copy</button><button class="act regen"><i class="fa-solid fa-rotate-right"></i> Regenerate</button></div>` : ''}</div>`;
  thread.appendChild(el);
  toBottom();
  return el;
}

/* ---------- typewriter ---------- */
function typewrite(el, text, done) {
  const body = el.querySelector('.body');
  const step = Math.max(1, Math.ceil(text.length / 700));
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cur';
  const paint = () => {
    const stick = nearBottom();
    body.innerHTML = render(text.slice(0, i));
    let last = body;
    while (last.lastElementChild && last.lastElementChild.tagName !== 'BR') last = last.lastElementChild;
    last.appendChild(cursor);
    if (stick) toBottom();
  };
  const finish = shown => {
    clearInterval(timer); timer = null; stopFn = null;
    body.innerHTML = render(shown);
    el.dataset.text = shown;
    if (el._m) { el._m.text = shown; persist(); }
    el.querySelector('.actions').classList.remove('hide');
    setBusy(false);
    done && done();
  };
  stopFn = () => finish(text.slice(0, i));
  timer = setInterval(() => {
    i = Math.min(text.length, i + step);
    paint();
    if (i >= text.length) finish(text);
  }, SPEEDS[prefs.speed] || 14);
}

/* ---------- API ---------- */
function extract(data) {
  if (typeof data === 'string') return data;
  for (const k of ['answer', 'response', 'result', 'text', 'message', 'output']) {
    if (typeof data?.[k] === 'string') return data[k];
  }
  return '```json\n' + JSON.stringify(data, null, 2) + '\n```';
}

async function ask(question, aiEl) {
  setBusy(true);
  const body = aiEl.querySelector('.body');
  const actions = aiEl.querySelector('.actions');
  actions.classList.add('hide');
  body.classList.remove('err');
  body.innerHTML = '<div class="dots"><i></i><i></i><i></i></div>';
  const slow = setTimeout(() => {
    body.insertAdjacentHTML('beforeend', '<div class="wait-note">Waking up the server. The first reply can take up to a minute.</div>');
  }, 6000);
  ctrl = new AbortController();
  stopFn = () => ctrl.abort();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    const raw = await res.text();
    let data; try { data = JSON.parse(raw); } catch { data = raw; }
    clearTimeout(slow);
    aiEl.dataset.q = question;
    typewrite(aiEl, extract(data).trim() || 'No answer was returned.');
  } catch (e) {
    clearTimeout(slow);
    aiEl.dataset.q = question;
    aiEl.dataset.text = '';
    if (aiEl._m) { aiEl._m.text = ''; persist(); }
    const stopped = e.name === 'AbortError';
    body.classList.toggle('err', !stopped);
    body.innerHTML = stopped ? '<em style="color:var(--mute)">Generation stopped.</em>'
      : `Could not reach the server. ${esc(e.message)}. Check your connection and try again.`;
    actions.classList.remove('hide');
    actions.querySelector('.copy').style.display = 'none';
    stopFn = null; setBusy(false);
  }
}

function submit(q) {
  q = q.trim();
  if (!q || busy) return;
  addMsg('user', esc(q).replace(/\n/g, '<br>'));
  input.value = ''; resize();
  if (!cur) { cur = { id: Date.now(), title: q.slice(0, 40), msgs: [] }; chats.unshift(cur); }
  const m = { role: 'ai', text: '', q };
  cur.msgs.push({ role: 'user', text: q }, m);
  const ai = addMsg('ai', ''); ai._m = m;
  persist(); renderHist();
  ask(q, ai);
}

/* ---------- events ---------- */
sendBtn.onclick = () => busy ? stopFn && stopFn() : submit(input.value);
input.addEventListener('input', resize);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(input.value); }
});

thread.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) return submit(chip.textContent);
  const btn = e.target.closest('.act');
  if (!btn) return;
  const el = btn.closest('.msg');
  if (btn.classList.contains('copy')) {
    navigator.clipboard?.writeText(el.dataset.text || '');
    btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
    setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 1500);
  } else if (!busy) {
    el.querySelector('.copy').style.display = '';
    ask(el.dataset.q, el);
  }
});

function renderHist() {
  $('#hist').innerHTML = chats.length
    ? chats.map(c => `<li data-id="${c.id}" class="${cur && cur.id === c.id ? 'active' : ''}"><span>${esc(c.title)}</span><button class="del" aria-label="Delete chat"><i class="fa-solid fa-xmark"></i></button></li>`).join('')
    : `<div class="hist-empty">${t('noChats')}</div>`;
  $('#clear').style.display = chats.length ? '' : 'none';
}
function closeSide() { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('show'); }
function newChat() {
  if (stopFn) stopFn();
  cur = null; thread.innerHTML = EMPTY;
  applyLang(); closeSide(); input.focus();
}
function loadChat(id) {
  if (stopFn) stopFn();
  cur = chats.find(c => c.id === id); if (!cur) return;
  thread.innerHTML = '';
  cur.msgs.forEach(m => {
    if (m.role === 'user') return addMsg('user', esc(m.text).replace(/\n/g, '<br>'), true);
    const el = addMsg('ai', '', true);
    el._m = m; el.dataset.q = m.q; el.dataset.text = m.text;
    el.querySelector('.body').innerHTML = m.text ? render(m.text) : '<em style="color:var(--mute)">No answer was saved. Use Regenerate to ask again.</em>';
    el.querySelector('.actions').classList.remove('hide');
    if (!m.text) el.querySelector('.copy').style.display = 'none';
  });
  renderHist(); closeSide(); toBottom();
}
$('#newChat').onclick = newChat;
$('#hist').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const id = +li.dataset.id;
  if (e.target.closest('.del')) {
    chats = chats.filter(c => c.id !== id); persist();
    return cur && cur.id === id ? newChat() : renderHist();
  }
  loadChat(id);
});
$('#clear').onclick = () => {
  if (!chats.length || !confirm('Delete all saved chats? This cannot be undone.')) return;
  chats = []; persist(); newChat();
};
const toggle = open => { $('#sidebar').classList.toggle('open', open); $('#scrim').classList.toggle('show', open); };
$('#menu').onclick = () => toggle(true);
$('#scrim').onclick = () => toggle(false);
/* ---------- profile, settings, language ---------- */
const PKEY = 'documind_prefs_v1';
let prefs = { name: 'My workspace', email: '', photo: '', lang: 'en', speed: 'normal' };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PKEY)) || {}); } catch {}
const savePrefs = () => { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch {} };
const SPEEDS = { fast: 5, normal: 14, slow: 30 };
const LANGS = [['en', 'English'], ['ru', 'Roman Urdu'], ['ur', 'اردو']];
const T = {
  en: { newChat: 'New chat', hist: 'Chat history', clear: 'Clear history', sub: 'Document Q&A', title: 'What would you like to know?', lead: 'Ask a question about your documents and get an answer in seconds.', ph: 'Ask anything about your documents', foot: 'DocuMind can make mistakes. Check important information.', settings: 'Settings', language: 'Language', help: 'Get help', learn: 'Learn more', logout: 'Log out', noChats: 'No chats yet. Your conversations will appear here.' },
  ru: { newChat: 'Nayi chat', hist: 'Chat history', clear: 'History saaf karein', sub: 'Document sawal-jawab', title: 'Aap kya jaanna chahte hain?', lead: 'Apne documents ke baare mein sawal poochhein aur chand seconds mein jawab payein.', ph: 'Apne documents ke baare mein kuch bhi poochhein', foot: 'DocuMind se ghalti ho sakti hai. Zaroori maloomat dobara check karein.', settings: 'Settings', language: 'Zuban', help: 'Madad', learn: 'Mazeed jaanein', logout: 'Log out', noChats: 'Abhi koi chat nahi. Aap ki guftagu yahan nazar aayegi.' },
  ur: { newChat: 'نئی چیٹ', hist: 'چیٹ ہسٹری', clear: 'ہسٹری صاف کریں', sub: 'ڈاکیومنٹ سوال و جواب', title: 'آپ کیا جاننا چاہتے ہیں؟', lead: 'اپنے ڈاکیومنٹس کے بارے میں سوال پوچھیں اور چند سیکنڈ میں جواب پائیں۔', ph: 'اپنے ڈاکیومنٹس کے بارے میں کچھ بھی پوچھیں', foot: 'DocuMind سے غلطی ہو سکتی ہے۔ اہم معلومات کی تصدیق کریں۔', settings: 'سیٹنگز', language: 'زبان', help: 'مدد حاصل کریں', learn: 'مزید جانیں', logout: 'لاگ آؤٹ', noChats: 'ابھی کوئی چیٹ نہیں۔ آپ کی گفتگو یہاں نظر آئے گی۔' }
};
const t = k => (T[prefs.lang] || T.en)[k] ?? T.en[k];
const avInner = () => prefs.photo ? `<img src="${prefs.photo}" alt="">` : '<i class="fa-solid fa-user"></i>';

function applyLang() {
  document.documentElement.lang = prefs.lang === 'ur' ? 'ur' : 'en';
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  renderHist();
}
function applyProfile() {
  document.querySelectorAll('.av.u').forEach(a => a.innerHTML = avInner());
  $('#pName').textContent = prefs.name || 'My workspace';
  $('#pMail').textContent = prefs.email || 'Local profile';
}

function closeModal() { $('#modal')?.remove(); }
function modal(title, html, onMount) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'modal'; m.id = 'modal';
  m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><div class="dh"><b>${title}</b><button class="x" aria-label="Close"><i class="fa-solid fa-xmark"></i></button></div><div class="db">${html}</div></div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('.x')) closeModal(); });
  document.body.appendChild(m);
  onMount && onMount(m);
}
function readPhoto(file, cb) {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'), n = 160; c.width = c.height = n;
      const k = Math.max(n / img.width, n / img.height), w = img.width * k, h = img.height * k;
      c.getContext('2d').drawImage(img, (n - w) / 2, (n - h) / 2, w, h);
      cb(c.toDataURL('image/jpeg', 0.85));
    };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

function openSettings() {
  let pending = prefs.photo;
  modal(t('settings'), `
    <div class="prow"><span class="av big" id="sPrev"></span>
      <div><label class="btn" for="sFile"><i class="fa-solid fa-camera"></i> Upload photo</label><input type="file" id="sFile" accept="image/*" hidden>
      <button class="btn ghost" id="sRm" type="button">Remove</button></div></div>
    <label class="fl">Name<input id="sName" maxlength="30"></label>
    <label class="fl">Email (optional)<input id="sMail" type="email" maxlength="60"></label>
    <label class="fl">Typing speed<select id="sSpeed"><option value="fast">Fast</option><option value="normal">Normal</option><option value="slow">Slow</option></select></label>
    <button class="btn pri" id="sSave" type="button">Save changes</button>`, m => {
    const q = s => m.querySelector(s);
    const paint = () => q('#sPrev').innerHTML = pending ? `<img src="${pending}" alt="">` : '<i class="fa-solid fa-user"></i>';
    q('#sName').value = prefs.name; q('#sMail').value = prefs.email; q('#sSpeed').value = prefs.speed; paint();
    q('#sFile').onchange = e => { const f = e.target.files[0]; if (f) readPhoto(f, d => { pending = d; paint(); }); };
    q('#sRm').onclick = () => { pending = ''; paint(); };
    q('#sSave').onclick = () => {
      Object.assign(prefs, { name: q('#sName').value.trim() || 'My workspace', email: q('#sMail').value.trim(), speed: q('#sSpeed').value, photo: pending });
      savePrefs(); applyProfile(); closeModal();
    };
  });
}
function openLang() {
  modal(t('language'), LANGS.map(([k, n]) => `<button class="lopt ${prefs.lang === k ? 'on' : ''}" data-l="${k}"><span dir="auto">${n}</span>${prefs.lang === k ? '<i class="fa-solid fa-check"></i>' : ''}</button>`).join(''),
    m => m.querySelectorAll('.lopt').forEach(b => b.onclick = () => { prefs.lang = b.dataset.l; savePrefs(); applyLang(); closeModal(); }));
}
const INFO = {
  help: ['Get help', '<ul class="tips"><li>Type a question about your document and press Enter.</li><li>Shift + Enter adds a new line.</li><li>Press the square button to stop a reply.</li><li>Hover over a reply to copy it or regenerate it.</li><li>Your chats are saved in this browser only.</li></ul>'],
  about: ['About DocuMind', '<p>DocuMind answers questions about your documents. Ask in plain language and get a written answer you can copy or regenerate.</p>'],
  shortcuts: ['Keyboard shortcuts', '<ul class="tips"><li><b>Enter</b>: send message</li><li><b>Shift + Enter</b>: new line</li><li><b>Esc</b>: close menus and dialogs</li></ul>'],
  privacy: ['Privacy', '<p>Your chats, name and photo are stored only in this browser. Your questions are sent to the DocuMind server to get an answer.</p>']
};

const pm = $('#pmenu'), pb = $('#pBtn');
const setMenu = o => { pm.classList.toggle('open', o); pb.setAttribute('aria-expanded', o); if (!o) { $('#psub').classList.remove('open'); pm.querySelector('[data-act=learn]').classList.remove('openc'); } };
pb.onclick = e => { e.stopPropagation(); setMenu(!pm.classList.contains('open')); };
document.addEventListener('click', e => { if (!pm.contains(e.target) && !pb.contains(e.target)) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); setMenu(false); } });
pm.addEventListener('click', e => {
  const b = e.target.closest('.pi'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'learn') { $('#psub').classList.toggle('open'); b.classList.toggle('openc'); return; }
  setMenu(false); closeSide();
  if (a === 'settings') openSettings();
  else if (a === 'language') openLang();
  else if (INFO[a]) modal(...INFO[a]);
  else if (a === 'logout' && confirm('Reset your name and photo on this browser?')) {
    Object.assign(prefs, { name: 'My workspace', email: '', photo: '' }); savePrefs(); applyProfile();
  }
});
applyLang();
applyProfile();
</script>
</body>
</html>
